# Reference config for /etc/nginx/sites-available/prince-esquire
# Apply with: sudo nginx -t && sudo systemctl reload nginx

# www → apex, so Google only ever sees one version of each URL
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.prince-esquire.co.ke;
    ssl_certificate /etc/letsencrypt/live/prince-esquire.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prince-esquire.co.ke/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://prince-esquire.co.ke$request_uri;
}

server {
    server_name prince-esquire.co.ke;
    root /var/www/sites/prince-esquire.co.ke/frontend/dist;
    index index.html;
    client_max_body_size 50m;

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:5000/api/seo/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        try_files /robots.txt =404;
        default_type text/plain;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Googlebot may fetch these to render pages, but they are not pages themselves.
        add_header X-Robots-Tag "noindex" always;
    }

    # Fingerprinted build files never change
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker must always be revalidated or updates get stuck on devices
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:jpe?g|png|webp|avif|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /index.html {
        return 301 /;
    }

    # Every page URL: real files first, otherwise server-rendered HTML
    location / {
        try_files $uri @ssr;
    }

    location = / {
        try_files /__no_static_home__ @ssr;
    }

    location @ssr {
        rewrite ^ /ssr-html break;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
        proxy_read_timeout 15s;
        # If the API is down the shop still loads as the plain app
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa;
    }

    location @spa {
        add_header Cache-Control "no-cache";
        try_files /index.html =503;
    }

    listen [::]:443 ssl http2; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/prince-esquire.co.ke/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/prince-esquire.co.ke/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name prince-esquire.co.ke www.prince-esquire.co.ke;
    return 301 https://prince-esquire.co.ke$request_uri;
}
